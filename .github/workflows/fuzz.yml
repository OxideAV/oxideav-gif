name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. The 30-minute
# total budget is split across every target the crate-fuzz workflow
# discovers (decode / decode_panic_free / decode_lenient_panic_free /
# roundtrip / encode).

on:
  schedule:
    - cron: "37 5 * * *"   # daily 05:37 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
