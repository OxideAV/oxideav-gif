[package]
name = "oxideav-gif"
version = "0.0.8"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust GIF codec + container (87a/89a decoder + encoder, animation, LZW)"
repository = "https://github.com/OxideAV/oxideav-gif"
homepage = "https://github.com/OxideAV/oxideav-gif"
readme = "README.md"
keywords = ["multimedia", "image", "gif", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# image-library consumers can depend on `oxideav-gif` with
# `default-features = false` and avoid the framework dependency tree
# entirely. Without `registry` the crate exposes a free-standing
# `decode_gif` / `encode_gif` API plus local `GifImage` / `GifFrame` /
# `GifError` types and never references `oxideav-core`.
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]

# Wires up the codec / encoder / decoder / demuxer / muxer trait
# implementations against `oxideav-core` so the crate can plug into the
# `oxideav` framework registry. Default-on; turn off for image-library
# use-cases that just want the standalone `decode_gif` API.
registry = ["dep:oxideav-core"]

[dev-dependencies]
# `tests/external_roundtrip.rs` `dlopen`s the system-installed giflib at
# runtime to drive a four-stage cross-codec round-trip
# (oxideav-encode → giflib-decode → giflib-encode → oxideav-decode).
# No giflib source is pulled into the workspace dep tree; the test
# silently skips when the shared library is missing.
libloading = "0.8"
