[package]
name = "oxideav-gif"
version = "0.0.11"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/OxideAV/oxideav-gif"
authors = ["Mark Karpeles"]
description = "Pure-Rust GIF87a / GIF89a decoder and encoder"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-gif"
keywords = ["multimedia", "image", "gif", "lzw", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# image-library consumers can depend on `oxideav-gif` with
# `default-features = false` and avoid the framework dep tree entirely.
# Without `registry` the crate exposes only the standalone
# `decode` / `encode` / `compose` API plus crate-local `GifImage` /
# `Error` types using std primitives.
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
# Wires up the `Decoder` / `Encoder` trait impls + the framework
# `register()` entry point against `oxideav-core`. Default-on; turn
# off for image-library use-cases that just want the standalone API.
registry = ["dep:oxideav-core"]

[dev-dependencies]
# Round 129 (depth-mode benchmarks): Criterion drives the three bench
# harnesses (`decode`, `encode`, `roundtrip`) that future encoder /
# decoder / LZW optimisation rounds use to A/B their changes. Pinned
# to the same 0.5 line the other OxideAV crates with benches
# (cinepak, magicyuv, h264, pixfmt, tta) already track.
criterion = "0.5"

# Round 129 benches. Each binary lives in `benches/<name>.rs` and is
# self-contained (no committed fixture files). Run with:
#     cargo bench -p oxideav-gif --bench <name>
[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "roundtrip"
harness = false

# Round 194 (depth-mode benchmarks): direct Appendix F LZW codec-pair
# harness — pairs `lzw::encode` / `lzw::decode` per size so future
# optimisation rounds can attribute their delta to the codec in
# isolation rather than the surrounding GIF container path. See
# `BENCHMARKS.md` for the matrix + baseline numbers.
[[bench]]
name = "lzw"
harness = false
