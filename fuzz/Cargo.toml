[package]
name = "oxideav-gif-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-gif]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_panic_free"
path = "fuzz_targets/decode_panic_free.rs"
test = false
doc = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "decode_lenient_panic_free"
path = "fuzz_targets/decode_lenient_panic_free.rs"
test = false
doc = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false

[[bin]]
name = "plain_text"
path = "fuzz_targets/plain_text.rs"
test = false
doc = false

[[bin]]
name = "lzw"
path = "fuzz_targets/lzw.rs"
test = false
doc = false
